[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slotstream-spark"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mac = ["pytest", "numpy", "jinja2", "tokenizers", "starlette", "uvicorn", "h11", "httpx", "hypothesis"]
dev = ["pytest", "hypothesis"]

[tool.setuptools.packages.find]
include = ["slotstream_spark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gate' --strict-markers -p no:cacheprovider"
markers = [
    "gate: needs model weights on the Spark; run under deploy/guard.sh",
    "cuda: needs a CUDA GPU",
]
