# Numeric contract of the engine against the transformers oracle (tools/ref_layerwise.py).
# Rule and fixed values are frozen here, before any engine comparison. The arrays under [layer] and
# [routing] are empty, and the [logits] limits and [fixture] kl_max_nats are -1.0, until
# `tools/calibrate_contract.py apply` fills them from oracle-only dumps (bf16 vs fp32 oracle, wrong-expert
# controls); never from engine results. The logits limits follow rule_logits (design decision 12).

[layer]
metric = "rel_l2"   # ||engine - oracle||_2 / ||oracle||_2 of the hyper-width layer output [T,10240], same ids, each along its own trajectory
rule = "L_k = 2*s_k + margin; separable iff c_k >= 4*s_k and c_k >= 2*L_k"
